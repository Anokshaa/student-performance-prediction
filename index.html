<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        input {
            margin: 5px;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>Student Performance Prediction</h1>

<p>Enter the student's details below:</p>

<label>Student Name:</label>
<input type="text" id="name"><br>

<label>Previous Marks:</label>
<input type="number" id="marks"><br>

<label>Attendance (%):</label>
<input type="number" id="attendance"><br>

<label>Study Hours per Day:</label>
<input type="number" id="studyHours"><br>

<button onclick="predictPerformance()">Predict Performance</button>

<div id="result"></div>

<script>

function predictPerformance() {

    let name = document.getElementById("name").value;
    let marks = Number(document.getElementById("marks").value);
    let attendance = Number(document.getElementById("attendance").value);
    let studyHours = Number(document.getElementById("studyHours").value);

    let performance;
    let suggestion;
    let targetMarks;

    if (marks >= 75 && attendance >= 75 && studyHours >= 5) {

        performance = "Excellent";
        suggestion =
            "Maintain your current study habits and performance.";
        targetMarks = Math.min(marks + 5, 100);

    } else if (marks >= 50 && attendance >= 60 && studyHours >= 3) {

        performance = "Good";
        suggestion =
            "Increase study hours and maintain regular attendance.";
        targetMarks = Math.min(marks + 10, 100);

    } else {

        performance = "Needs Improvement";
        suggestion =
            "Improve attendance, marks and study regularly.";
        targetMarks = Math.min(marks + 15, 100);
    }

    document.getElementById("result").innerHTML =
        "<h2>Student Performance Result</h2>" +
        "<b>Student:</b> " + name + "<br>" +
        "<b>Previous Marks:</b> " + marks + "<br>" +
        "<b>Attendance:</b> " + attendance + "%<br>" +
        "<b>Study Hours:</b> " + studyHours + " hours/day<br>" +
        "<b>Performance:</b> " + performance + "<br>" +
        "<b>Improvement Suggestion:</b> " + suggestion + "<br>" +
        "<b>Target Marks:</b> " + targetMarks;
}

</script>

</body>
</html>
